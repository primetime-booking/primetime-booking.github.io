name: PrimeTime client Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check client source
        run: |
          node --check app.js
          node --check catalog-router.js
          node --check booking.js
          node --check my-bookings.js
          node --check waitlist.js
          node --check sw.js
          node --check site-update.js
          node tests/client-pages-static-test.mjs
          node tests/sw-cache-failure-test.mjs
          node tests/catalog-root-router-test.mjs
          node availability-loading-recovery-test.mjs
          node tests/availability-compact-v165-test.mjs
          node public-booking-flow-test.mjs
      - name: Verify compact availability migration and rollback
        run: |
          npm install --prefix "$RUNNER_TEMP/v165-pglite" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
          MINUTA_PGLITE_MODULE="$RUNNER_TEMP/v165-pglite/node_modules/@electric-sql/pglite/dist/index.js" node tests/availability-compact-v165-pglite-test.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
